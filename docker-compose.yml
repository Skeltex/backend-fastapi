services:
  api:
    build: .
    container_name: fastapi_blog
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./logs:/app/logs
    command: >
      sh -c "uv run alembic upgrade head && 
             uv run fastapi run main.py --host 0.0.0.0 --port 8000"
